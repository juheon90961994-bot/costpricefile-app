<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>제품 원가 생성</title>
  <link rel="stylesheet" href="styles.css?v=20260921-2">
  <script defer src="xlsx.full.min.js"></script>
  <script defer src="exceljs.min.js"></script>
  <script defer src="config.local.js"></script>
  <script defer src="app.js?v=20260921-1"></script>
  <script defer src="cost-upload.js?v=20260923-1"></script>
  <script defer src="cost-lookup.js?v=20260918-1"></script>
</head>
<body>
  <main>
    <header class="hero">
      <div class="app-icon" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>제품 원가 생성</h1>
      <p class="app-version">Version 3.1.1</p>

      <nav class="mode-tabs" aria-label="원가 작업 메뉴">
        <button class="mode-tab" id="tabLookup" type="button">원가 조회</button>
        <button class="mode-tab active" id="tabGenerate" type="button">제품 원가 생성</button>
        <button class="mode-tab" id="tabUpload" type="button">원가 업로드</button>
        <button class="mode-tab outline" id="tabDownload" type="button">원가 다운로드</button>
      </nav>
    </header>

    <section class="workspace" id="costWorkspace">
      <h2>제품 BOM 올리기</h2>

      <button class="dropzone" id="dropzone" type="button">
        <input id="fileInput" type="file" accept=".xls,.xlsx,.xlsm">
        <span class="file-copy">
          <strong id="fileName">제품 BOM 파일을 선택해 주세요</strong>
          <small id="fileMeta">Excel 파일</small>
        </span>
        <span class="select-file">파일 선택</span>
      </button>

      <div class="status idle" id="status"><span>i</span><p>엑셀 파일을 선택해 주세요.</p></div>

      <button class="convert" id="convert" disabled>제품 원가 생성 <b>→</b></button>
    </section>

    <section class="workspace upload-workspace" id="uploadWorkspace" hidden>
      <div class="upload-title-row">
        <h2>원가 업로드</h2>
        <button class="settings-button" id="toggleSupabaseSettings" type="button" hidden>연결 설정</button>
      </div>

      <div class="connection-settings" id="supabaseSettings" hidden>
        <label>Supabase URL<input id="supabaseUrl" type="url" placeholder="https://프로젝트.supabase.co" autocomplete="off"></label>
        <label>Publishable key<input id="supabaseAnonKey" type="password" placeholder="Supabase publishable key" autocomplete="off"></label>
        <label>로그인 이메일<input id="supabaseEmail" type="email" placeholder="Supabase Auth 이메일" autocomplete="username"></label>
        <label>로그인 비밀번호<input id="supabasePassword" type="password" placeholder="Supabase Auth 비밀번호" autocomplete="current-password"></label>
        <button id="supabaseLogin" type="button">Supabase 로그인</button>
        <label>Access token <small>자동 입력</small><input id="supabaseAccessToken" type="password" placeholder="로그인하면 자동으로 입력됩니다" autocomplete="off"></label>
        <button id="saveSupabaseSettings" type="button">설정 저장</button>
      </div>

      <button class="dropzone upload-dropzone" id="costUploadDropzone" type="button">
        <input id="costUploadInput" type="file" accept=".xls,.xlsx,.xlsm">
        <span class="file-copy">
          <strong id="costUploadFileName">업로드할 Excel 파일을 선택해 주세요</strong>
          <small>Excel 파일</small>
        </span>
        <span class="select-file">파일 선택</span>
      </button>

      <div class="upload-actions">
        <p class="upload-message" id="uploadMessage" role="status"></p>
        <button class="analyze-button" id="analyzeUpload" type="button" disabled hidden>업로드 분석</button>
      </div>

      <div class="upload-preview" id="uploadPreview" hidden>
        <div class="summary-grid" aria-label="분석 결과">
          <div><span>신규</span><strong id="newCount">0</strong></div>
          <div><span>수정</span><strong id="updateCount">0</strong></div>
          <div><span>변경 없음</span><strong id="unchangedCount">0</strong></div>
          <div class="attention"><span>확인 필요</span><strong id="reviewCount">0</strong></div>
        </div>

        <div class="preview-table-wrap">
          <table>
            <thead><tr><th>구분</th><th>행</th><th>품목</th><th>내용</th></tr></thead>
            <tbody id="uploadPreviewBody"></tbody>
          </table>
        </div>

        <button class="convert upload-execute" id="executeUpload" type="button">업로드 실행 <b>→</b></button>
      </div>

      <div class="upload-progress" id="uploadProgress" hidden>
        <div><span id="progressText">0 / 0</span><strong id="progressPercent">0%</strong></div>
        <progress id="progressBar" value="0" max="100"></progress>
      </div>

      <div class="upload-result" id="uploadResult" hidden></div>
    </section>

    <section class="workspace lookup-workspace" id="lookupWorkspace" hidden>
      <h2>원가 조회</h2>
      <form class="lookup-form" id="costLookupForm">
        <label for="costLookupItem">품목</label>
        <div>
          <input id="costLookupItem" type="search" placeholder="품목을 입력해 주세요" autocomplete="off">
          <button id="costLookupButton" type="submit">조회</button>
        </div>
      </form>
      <p class="lookup-message" id="costLookupMessage" role="status"></p>
      <div class="lookup-table-wrap" id="costLookupResults" hidden>
        <table>
          <thead>
            <tr>
              <th>품목</th><th>품목명</th><th>거래처명</th><th>담당자</th><th>단위</th><th>달러단가</th><th>원화단가</th><th>관리</th>
            </tr>
          </thead>
          <tbody id="costLookupBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
